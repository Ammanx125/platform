[project]
name = "sansa-platform"
version = "0.1.0"
description = "Sansa — AI management system for managers."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sansa" }]
dependencies = [
    # Core framework & server
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # Database & migrations
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.2,<1.0",

    # Auth, security & crypto
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT>=2.8,<3.0",
    "cryptography>=42.0,<46.0",

    # Utilities & HTTP
    "httpx>=0.27,<1.0",
    "tenacity>=8.3,<10.0",
    "python-multipart>=0.0.9,<1.0",
    "slowapi>=0.1.9,<1.0",

    # Web & templates
    "jinja2>=3.1,<4.0",

    # Data processing & ingestion
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=4.2,<6.0",

    # Matching (semantic mapping, Step 5b)
    "rapidfuzz>=3.9,<4.0",

    # ML & analytics
    "scikit-learn>=1.5,<2.0",
    "statsmodels>=0.14,<1.0",
    "numpy>=1.26,<3.0",

    # Observability
    "structlog>=24.1,<26.0",
    "prometheus-client>=0.20,<1.0",
    "sqlglot>=25.0,<27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.7,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
mypy_path = "."
explicit_package_bases = true
namespace_packages = true