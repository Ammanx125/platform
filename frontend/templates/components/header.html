<div class="brand">
  <span class="brand-mark" aria-hidden="true"></span>
  <span>{{ app_name }}</span>
</div>

<header class="topbar">
  <div class="topbar-left">
    <span class="tenant-name">{{ tenant_name }}</span>
    {% include "components/loop_indicator.html" %}
  </div>
  <div class="topbar-right">
    <span class="user-chip">{{ user_email }}</span>
    <button class="btn btn-sm"
            hx-post="/logout"
            hx-swap="none"
            hx-on::after-request="if(event.detail.successful) window.location.href='/login'">
      Sign out
    </button>
  </div>
</header>
