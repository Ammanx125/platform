services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sansa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sansa
      POSTGRES_PASSWORD: sansa
      POSTGRES_DB: sansa
    ports:
      - "5432:5432"
    volumes:
      - sansa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sansa -d sansa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sansa_pgdata: